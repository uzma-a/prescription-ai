server {
    # Cloud Run requires us to listen on the port specified by the PORT environment variable.
    # We will set our Nginx to listen on 8080.
    listen 8080;
    
    # Set the root folder to where we copied the React build files
    root /usr/share/nginx/html;
    
    # Try to serve a file directly, and if not found (like for a React route),
    # fall back to index.html so the React Router can handle it.
    location / {
    try_files $uri $uri/ /index.html;
}
}
